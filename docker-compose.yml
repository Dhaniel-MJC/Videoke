version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: videoke-postgres
    environment:
      POSTGRES_DB: videoke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: videoke_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videoke-network

  redis:
    image: redis:7-alpine
    container_name: videoke-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videoke-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videoke-backend
    environment:
      DATABASE_URL: postgresql://postgres:videoke_dev@postgres:5432/videoke
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: dev_secret_key_change_in_production
      JWT_EXPIRE: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - videoke-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videoke-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - videoke-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  videoke-network:
    driver: bridge
